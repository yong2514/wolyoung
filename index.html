<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#141a3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>월영</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #0b0f26; overflow: hidden;
      overscroll-behavior: none;          /* 당겨서 새로고침 막기 */
      touch-action: none;                 /* 스크롤·확대 막기 */
      -webkit-user-select: none; user-select: none;   /* 글자 선택 막기 */
      -webkit-touch-callout: none;        /* 길게 눌러 뜨는 메뉴 막기 */
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      position: fixed;
      /* 노치(안전 영역)만큼 비우고 그 안에 게임을 맞춘다 */
      top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
      left: env(safe-area-inset-left); right: env(safe-area-inset-right);
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
